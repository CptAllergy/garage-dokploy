services:
  garage:
    image: dxflrs/garage:v2.4.1
    volumes:
      - ../files/garage.toml:/etc/garage.toml
      - garage-storage:/var/lib/garage
    networks:
      - dokploy-network
    restart: unless-stopped
    expose:
      - 3900
      - 3901
      - 3903
volumes:
  garage-storage: {}
networks:
  dokploy-network:
    external: true

